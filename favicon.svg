<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Circle Background for contrast -->
  <circle cx="50" cy="50" r="48" fill="#080B11" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Glowing Crescent Moon -->
  <path d="M 52,18 C 32,18 18,34 18,52 C 18,70 32,84 52,84 C 65,84 76,77 82,66 C 62,72 40,56 42,34 C 43,27 47,21 52,18 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)" />
  <!-- Decorative Star Accent -->
  <polygon points="68,34 71,41 78,41 72,46 74,53 68,48 62,53 64,46 58,41 65,41" 
           fill="url(#goldGrad)" />
</svg>
